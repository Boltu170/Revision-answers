const WEEKS=[
{"n":1,"t":"Accounting Overview Quiz","q":[["Under the accrual basis, entities record transactions:",["Only when cash is received or paid","When they occur, regardless of cash timing","When invoices are approved for payment","Only at year-end"],1,"Accrual accounting records transactions when they happen, not when cash moves."],["Another component listed among financial report elements was:",["Statement of cash flows","Cash budget","Forecast","Internal audit charter"],0,"The statement of cash flows is a core financial statement. The others are internal documents.","This refers to lecture slides. A is the only option that is a financial statement."],["Which item appears on the Statement of Profit and Loss?",["Trade receivables","Inventory","Share capital","Revenue"],3,"Revenue is a P&L item. Receivables, inventory and share capital are on the Statement of Financial Position."],["A van used in operations would normally be classified as:",["Non-current asset","Current asset","Current liability","Expense"],0,"A van is used over several years, so it is a non-current asset (property, plant and equipment)."],["The going concern concept assumes that a business:",["Will liquidate within a year","Must show profits every year","Should distribute all cash to shareholders","Is financially stable and will meet obligations for the foreseeable future"],3,"Going concern assumes the business will continue operating and meet its obligations for the foreseeable future."],["What are the core statements in the annual financial report?",["Sales report and bank reconciliation","Income statement, Statement of Financial Position, Statement of changes in equity, and Statement of cash flows","Director's report and audit opinion","Budgeted income statement only"],1,"The four core statements are the income statement, financial position, changes in equity and cash flows."],["An asset is best defined as:",["Any item the business intends to sell","A legal claim of owners","A present economic resource controlled from past events with future benefits","A future obligation"],2,"This is the conceptual framework definition of an asset."],["Which best reflects the purpose of financial accounting?",["Internal control design","Setting selling prices","Reporting financial information to external users","Scheduling production"],2,"Financial accounting reports to external users such as investors, lenders and regulators."],["Which item is least likely to appear on the Statement of Profit and Loss?",["Cost of sales","Administrative expenses","Revenue","Dividends paid"],3,"Dividends are a distribution of profit and appear in the statement of changes in equity, not the P&L."],["Which industry was listed among higher-pay sectors for accountants?",["Financial services (banking, asset/wealth, PE/Hedge Funds)","Hospitality and tourism","Agriculture","Local government"],0,"Financial services is the sector listed as higher-paying.","This depends on the lecture slide. A is the only plausible option."],["On the Statement of Financial Position, equity is shown alongside",["Only assets","Only liabilities","Retained earnings only","Assets and liabilities"],3,"The statement shows assets, liabilities and equity, which are linked by the accounting equation.","Equity is usually presented with liabilities, but D is the best option here."],["In larger organisations, the accounts department typically:",["Is run by a single clerk to avoid segregation of duties","Is divided into distinct functions, each with specific tasks","Reports directly to external auditors","Does not handle transaction processing"],1,"Larger organisations split work into functions such as payables, receivables, payroll and reporting."],["Which option best describes financial accounting?",["Identifying, recording, summarising and analysing transactions to report in financial statements","Managing day-to-day cash collections","Choosing between alternative product mixes","Setting standard costs and variances"],0,"Financial accounting records and summarises transactions for the financial statements."],["Under the accrual basis, revenue is recognised when:",["Cash is received","An order is approved internally","Control/performance obligations are met, regardless of cash timing","The bank balance increases"],2,"Revenue is recognised when the performance obligation is satisfied."],["Income typically results in:",["A decrease in assets and equity","A decrease in liabilities and equity","An increase in equity via increased assets or decreased liabilities","No effect on equity"],2,"Income increases equity, either by increasing assets or by decreasing liabilities."],["Expenses typically:",["Increase equity","Decrease equity and may decrease assets or increase liabilities","Have no effect on assets","Always create cash outflows"],1,"Expenses reduce equity. Accrued expenses increase liabilities without immediate cash outflow."],["Which statement for Limited Liabilty Company is correct?",["Directors manage the company for shareholders","Shareholders manage day-to-day operations by default","Shares can never be transferred","The company is not a separate legal person"],0,"Directors run the company on behalf of the shareholders. The company is a separate legal person."],["Which of the following statement about \"Notes to the financial statements\" is correct?",["Optional marketing materials","Part of the financial reports providing detail and explanations","Binding legal contracts","Payroll manuals"],1,"The notes are an integral part of the financial statements, giving policies, detail and explanations."],["Tangible assets are those with:",["Physical substance","No physical substance","Monetary form only","No future benefit"],0,"Tangible assets (e.g. buildings, vehicles) have physical form. Intangible assets don't."],["Which branch of accounting is primarily for internal planning and decision-making?",["Financial accounting","External auditing","Management accounting","Taxation"],2,"Management accounting supports internal planning and decisions."],["Which of the following is not one of the legal forms listed for a UK business",["Sole trader","Limited liability partnership (LLP)","S corporation","Public limited company (PLC)"],2,"An S corporation is a US tax structure. The others are UK business forms."],["Which item is least likely to appear on the Statement of Financial Position?",["Sales revenue","Trade receivables","Inventory","Property, plant and equipment"],0,"Sales revenue is a P&L item. The others are assets on the Statement of Financial Position."],["Which of the following is most aligned with the regulatory framework concept discussed?",["Preparing statements without reference to standards","Using IFRS/standards to guide recognition, measurement and presentation","Relying only on tax rules","Using management's preferred format regardless of users"],1,"The regulatory framework uses accounting standards (e.g. IFRS) to guide recognition, measurement and presentation."],["The accounting equation is:",["Assets = Liabilities + Equity","Assets + Equity = Liabilities","Assets − Liabilities = Expenses","Assets = Equity − Liabilities"],0,"Assets = Liabilities + Equity."],["A key feature of a limited company (Ltd) is:",["Unlimited liability of shareholders","Profits taxed only on shareholders personally","Shares cannot be transferred","The company can contract in its own right"],3,"A company is a separate legal person, so it can contract in its own name."],["In an Limited Liability Company, directors primarily:",["Protect shareholders' assets and manage on their behalf","Represent only creditors","Are not responsible for stewardship","Must always be the majority shareholders"],0,"Directors have a stewardship role: managing the company on shareholders' behalf."],["A liability is a:",["Future plan to invest in assets","Present obligation from past events expected to result in an outflow of resources","Residual interest of owners","Deferred income only"],1,"This is the conceptual framework definition of a liability."],["Which qualifies as a current asset?",["A building held for five years","Long-term loan to a subsidiary","Goodwill","Inventory expected to be sold within the normal operating cycle"],3,"Inventory expected to be sold within the operating cycle is a current asset."],["Which of the following is a current liability?",["10-year bank loan with no current instalments","Deferred tax liability","Trade payables due in 30 days","Share premium"],2,"Trade payables due within 30 days are due within a year, so they are current liabilities."],["Equity (capital) represents:",["Gross assets owned by the company","Only retained earnings","All third-party financing","Money owed to the owner(s); the residual after liabilities are deducted from assets"],3,"Equity = assets − liabilities, the residual interest of the owners."]]},
{"n":2,"t":"The Accounting Cycle","q":[["In double-entry, if you debit an asset, the balancing entry must be a:",["Debit to income","Credit to the same asset","Credit to another account","Debit to capital"],2,"Every debit needs an equal credit in a different account. Debiting an asset needs a credit elsewhere (e.g. another asset, liability or income)."],["A decrease in an asset is recorded as a:",["Debit","Credit","Either side","Not recorded"],1,"Assets increase with debits and decrease with credits."],["The purpose of the Sales Day Book is to:",["Record all sales (cash and credit)","Record purchase returns","Record VAT payments only","Summarise daily credit sales for posting to the general ledger"],3,"The Sales Day Book is a book of prime entry for credit sales, totals of which are posted to the ledger. Cash sales go in the cash book.","Option A could be argued, but 'cash and credit' is wrong because cash sales aren't in the Sales Day Book."],["After balancing off the account, the carried forward balance becomes:",["The opening balance of the next period","A suspense account entry","The brought forward balance in the next period","Written off"],2,"The balance carried down (c/d) at the end of a period appears on the opposite side as the balance brought down (b/d) at the start of the next.","Options A and C are close; C uses the standard bookkeeping term."],["Recording a cash sale £100 is:",["Dr Sales £100; Cr Cash £100","Dr Receivables £100; Cr Sales £100","Dr Cash £100; Cr Sales £100","Dr Sales £100; Cr Capital £100"],2,"Cash (asset) increases: debit. Sales (income) increases: credit."],["Recording a credit purchase £200 is:",["Dr Payables £200; Cr Purchases £200","Dr Expenses £200; Cr Cash £200","Dr Inventory £200; Cr Sales £200","Dr Purchases £200; Cr Payables £200"],3,"Purchases (expense) debit; the amount owed to the supplier (liability) credit."],["Owner introduces £15,000 cash as capital. The journal is:",["Dr Cash £15,000; Cr Capital £15,000","Dr Capital £15,000; Cr Cash £15,000","Dr Loan £15,000; Cr Drawings £15,000","Dr Sales £15,000; Cr Capital £15,000"],0,"Cash (asset) rises: debit. Capital (equity) rises: credit."],["Receive a bank loan of £20,000 paid into the bank account.",["Dr Capital £20,000; Cr Bank £20,000","Dr Bank Loan £20,000; Cr Bank £20,000","Dr Sales £20,000; Cr Bank £20,000","Dr Bank £20,000; Cr Bank Loan (Liability) £20,000"],3,"Bank (asset) increases: debit. Bank loan (liability) increases: credit."],["Pay loan interest £250 by bank.",["Dr Interest Expense £250; Cr Bank £250","Dr Bank Loan £250; Cr Bank £250","Dr Bank £250; Cr Interest Expense £250","Dr Interest Payable £250; Cr Bank £250"],0,"Interest is an expense (debit); bank falls (credit). Paying interest doesn't reduce the loan principal."],["Credit balances in the trial balance are usually:",["Liabilities, income and capital","Assets and expenses","Assets and capital","Expenses and drawings"],0,"Liabilities, income and capital have credit balances. Assets, expenses and drawings have debit balances."],["Record depreciation on fixtures £400 for the month.",["Dr Fixtures £400; Cr Cash £400","Dr Accumulated Depreciation £400; Cr Depreciation Expense £400","Dr Depreciation Expense £400; Cr Accumulated Depreciation – Fixtures £400","Dr Profit and Loss £400; Cr Fixtures £400"],2,"Depreciation is an expense (debit), with the credit going to the accumulated depreciation contra-asset. No cash is involved."],["Record monthly rent expense £900 paid by bank.",["Dr Bank £900; Cr Rent Expense £900","Dr Prepaid Rent £900; Cr Bank £900","Dr Accruals £900; Cr Bank £900","Dr Rent Expense £900; Cr Bank £900"],3,"Expense up (debit), bank down (credit)."],["The Cash Book records:",["Only cash received","Only cash paid","Non-cash transactions","All cash received and paid"],3,"The cash book records both receipts and payments."],["Buying a vehicle for cash increases:",["Expenses and decreases equity","Vehicle asset and decreases cash","Revenue and increases cash","Payables and cash"],1,"A vehicle is a non-current asset: Dr Vehicles, Cr Cash. One asset swaps for another."],["Balancing off a ledger account requires:",["Entering totals only on the debit side","Totalling both sides, inserting the larger total on each, and using a balancing figure","Closing the account with no totals","Posting to trial balance directly"],1,"Total both sides, put the larger total on both, and insert the balancing figure (c/d) on the smaller side."],["The general (nominal) ledger is:",["The system of accounts for assets, liabilities, income, expenses and equity","A list of all suppliers","A summary of cash only","A schedule of adjustments"],0,"The general ledger holds all the main accounts. A list of suppliers is the payables ledger."],["A decrease in a liability is recorded as a:",["Debit","Credit","Either side","Not recorded"],0,"Liabilities increase with credits and decrease with debits."],["Owner withdraws £700 cash for personal use.",["Dr Drawings £700; Cr Cash £700","Dr Capital £700; Cr Cash £700","Dr Wages £700; Cr Cash £700","Dr Cash £700; Cr Drawings £700"],0,"Drawings is the owner's withdrawal (debit); cash falls (credit)."],["Record bank charges £45 shown on the statement.",["Dr Bank £45; Cr Bank Charges £45","Dr Bank Charges (Expense) £45; Cr Bank £45","Dr Suspense £45; Cr Bank £45","Dr Cash £45; Cr Bank £45"],1,"Bank charges are an expense (debit) and reduce the bank balance (credit)."],["Pay supplier £3,000 by bank transfer to settle an existing payable:",["Dr Purchases £3,000; Cr Bank £3,000","Dr Bank £3,000; Cr Trade Payables £3,000","Dr Trade Payables £3,000; Cr Bank £3,000","Dr Expenses £3,000; Cr Bank £3,000"],2,"The liability falls (debit payables); bank falls (credit). The purchase was already recorded."],["The trial balance is a list of:",["Transactions for the period","Only revenue and expenses","Only assets and liabilities","All brought-forward balances"],3,"The trial balance lists the balances of all ledger accounts to check that total debits equal total credits.","None of the options is perfectly worded. D is the closest: it lists ledger balances, not transactions."],["Buy inventory on credit from Z Ltd for £4,200.",["Dr Inventory £4,200; Cr Trade Receivables £4,200","Dr Purchases £4,200; Cr Trade Payables £4,200","Dr Trade Payables £4,200; Cr Purchases £4,200","Dr Cash £4,200; Cr Purchases £4,200"],1,"Purchases debit; the amount owed to Z Ltd is a trade payable (credit), not a receivable."],["Debit balances in the trial balance are usually:",["Assets and expenses","Liabilities and income","Equity and liabilities","Capital and income"],0,"Assets and expenses (and drawings) have debit balances."],["After identifying accounts, you next decide:",["Tax rate","Posting order","Year-end date","Increase or decrease, and whether to debit or credit"],3,"Step 1: identify the accounts. Step 2: decide whether each increases or decreases, then debit or credit."],["Ledger accounts allow preparation of:",["Financial statements","Only a cash budget","Audit working papers","HMRC returns"],0,"Ledger balances feed the trial balance and then the financial statements."],["Which is listed as a typical adjustment to the trial balance?",["Bank reconciliation","Accruals and prepayments","Petty cash imprest","Dividend declaration"],1,"Typical year-end adjustments are accruals, prepayments, depreciation, and inventory."],["Double-entry requires that every transaction has:",["Two equal and opposite effects","One debit only","One credit only","Negative impact on the accounting equation"],0,"Every transaction has equal debits and credits, so the accounting equation stays balanced."],["Which is a book of prime entry?",["T-account","General ledger","Sales Day Book","Trial balance"],2,"Books of prime entry (day books, cash book, journal) are where transactions are first recorded."],["To record a transaction, you should first:",["Post to trial balance","Prepare financial statements","Identify the ledger accounts affected","Run depreciation"],2,"First identify the accounts affected, then decide on debit or credit."],["T-accounts have:",["Credits on the left, debits on the right","Debits on the left, credits on the right","Debits and credits on one side","No headings"],1,"Debits go on the left, credits on the right."]]},
{"n":3,"t":"Contemporary accounting issues","q":[["Which threat arises if an accountant has a financial stake in a client?",["Self-interest","Self-review","Advocacy","Intimidation"],0,"A financial interest in a client can influence judgement, which is a self-interest threat."],["Fraud is best defined as:",["Deception for unlawful gain","A clerical error","A financial reporting method","An ERP function"],0,"Fraud is intentional deception to gain an unlawful advantage. Errors are unintentional."],["The “5 Vs” of Big Data include all EXCEPT:",["Volume","Valuation","Velocity","Variety"],1,"The 5 Vs are Volume, Velocity, Variety, Veracity and Value. 'Valuation' is not one of them."],["Which term refers to “data too large for traditional tools to handle”?",["Big Data","ERP","Blockchain","Cloud ERP"],0,"This is the basic definition of Big Data."],["Hiding liabilities in separate entities is:",["Manipulation of revenue recognition","Delaying expenses","Window dressing","Off-balance sheet accounting"],3,"Moving debts into separate entities so they don't appear on the balance sheet is off-balance sheet accounting."],["A clothing retailer highlights its use of “sustainable fabrics” while ignoring reports of poor working conditions in supplier factories. This is best described as:",["Advocacy threat","Fraudulent reporting","Greenwashing","Off-balance sheet accounting"],2,"Greenwashing is promoting a misleadingly positive environmental or social image while ignoring negative practices."],["Visualisation tools (column charts, waterfall charts) are mainly used to:",["Hide expenses","Audit external firms","Manipulate tax records","Present financial data clearly"],3,"Charts make financial data easier to understand and communicate."],["Which AI tool can categorise transactions for Xero?",["Hubdoc","Oracle ERP","SAP","Tableau"],0,"Hubdoc captures documents and data for Xero and helps automate transaction coding."],["A long-standing close relationship with a client could create:",["Self-interest threat","Advocacy threat","Familiarity threat","Intimidation threat"],2,"Over-familiarity can reduce objectivity, which is a familiarity threat."],["An accountant designs an AI model to detect fraud. Later, she is asked to audit the system’s effectiveness. This is an example of:",["Advocacy threat","Self-review threat","Self-interest threat","Professional behaviour"],1,"Reviewing your own work is a self-review threat."],["Which is an example of delaying expenses?",["Recording supplier invoices in next year","Recording revenue too early","Moving debt to another company","Misreporting stock levels"],0,"Pushing expenses into a later period inflates current profit."],["Which principle means not disclosing client information without permission?",["Integrity","Objectivity","Professional behaviour","Confidentiality"],3,"Confidentiality means not disclosing client information without authority."],["AI in accounting is currently most useful for:",["Replacing auditors entirely","Increasing tax rates","Creating new accounting standards","Automating repetitive tasks and analysis"],3,"AI currently supports accountants by automating routine tasks and speeding up analysis. It doesn't replace professional judgement."],["Which practice is linked to misleading shareholders before raising finance?",["Advocacy threat","Window dressing","Money laundering","ERP"],1,"Window dressing makes the accounts look better than reality, e.g. before seeking finance."],["Which threat arises when accountants promote a client’s position too strongly?",["Familiarity","Advocacy","Self-review","Self-interest"],1,"Promoting a client's position too strongly threatens objectivity: an advocacy threat."],["Big Data analytics can help accountants by:",["Recording invoices","Filing tax returns automatically","Predicting future trends using large datasets","Issuing payroll slips"],2,"Analysing large datasets supports forecasting and trend identification."],["Which is a challenge of AI in accounting?",["Improving accuracy","Reducing fraud risk","Data privacy concerns","Faster reconciliations"],2,"Accuracy, fraud reduction and speed are benefits. Data privacy is a challenge."],["Which of the following best describes an ERP system?",["A system integrating multiple business functions","A spreadsheet tool","A fraud detection method","A government tax platform"],0,"ERP integrates functions such as finance, HR, procurement and inventory in one system."],["“Window dressing” means:",["Misreporting inventory","Making accounts look better than reality","Selling windows","Cleaning financial data"],1,"Window dressing is presenting the accounts more favourably than the true position."],["If an accountant reviews their own prior estimate, it is a:",["Advocacy threat","Familiarity threat","Self-interest threat","Self-review threat"],3,"Reviewing your own earlier work is a self-review threat."],["Which is a key step if an accountant finds illegal activity internally?",["Ignore it","Resign immediately","Post on social media","Report it to compliance and escalate if unresolved"],3,"Report it through the proper internal channels and escalate if it isn't resolved."],["A large retailer suffered a cyberattack through a phishing email that compromised its accounts payable system. Which control weakness most likely contributed?",["Inadequate employee training on cybersecurity","Lack of segregation of duties","Excessive ERP integration","Weak AI algorithms in fraud detection"],0,"Phishing succeeds when staff cannot recognise suspicious emails, so training is the most likely weakness."],["Which of the following is a benefit of AI in accounting?",["Higher training costs","Faster insights","More fraud opportunities","Over-reliance on technology"],1,"Faster insights is a benefit. The others are drawbacks or risks."],["Which principle requires accountants to be honest and straightforward?",["Confidentiality","Professional behaviour","Integrity","Objectivity"],2,"Integrity means being honest and straightforward in professional relationships."],["Which scenario BEST illustrates a self-interest threat?",["An auditor promotes a client’s tax position to HMRC.","An accountant owns shares in a client company they are auditing.","An auditor is asked to review their own prior forecast.","An accountant becomes overly friendly with a client’s CFO."],1,"Owning shares in an audit client is a financial interest. A is advocacy, C is self-review, D is familiarity."],["Recording sales before goods are delivered is:",["Delaying expenses","Window dressing","Manipulation of revenue recognition","Off-balance sheet accounting"],2,"Revenue should be recognised when control passes. Recording it early manipulates revenue recognition."],["A company using AI-based invoice processing finds that the algorithm frequently misclassifies supplier invoices. What is the MOST appropriate safeguard?",["Regular human review and validation of AI outputs","Switch off the AI system","Increase staff training in manual bookkeeping","Outsource all accounting work"],0,"Human oversight and validation keeps the efficiency benefits while catching errors."],["An accountant designs a forecast model for sales. Later, they are asked to audit whether the model’s assumptions were reasonable. What ethical threat arises?",["Familiarity","Advocacy","Intimidation","Self-review"],3,"Auditing a model you designed is a self-review threat."],["Cybersecurity means protecting:",["Only hardware","Systems and data from cyberattacks","Only employees","Only government systems"],1,"Cybersecurity protects systems, networks and data from cyberattacks."],["A key Anti money laundering measure when taking new clients is:",["Marketing services","Filing tax returns","Running background and identity checks","Preparing budgets"],2,"Customer due diligence (identity and background checks) is a core AML control."]]},
{"n":4,"t":"Management accounting and cost concepts","q":[["A manufacturing company pays £8,000 in factory rent per month. The rent remains the same whether the company produces 1,000 or 5,000 units, provided production remains within the factory's existing capacity. How should the rent be classified?",["Variable cost","Semi-variable cost","Direct material cost","Fixed cost"],3,"The cost stays the same in total within the relevant range of output, so it is a fixed cost."],["A delivery company records the following monthly information. Using the high-low method, what is the variable cost per delivery? [Table: Month | Deliveries | Total Cost — January | 2,000 | £14,000 — February | 3,000 | £18,000]",["£4","£2","£6","£8"],0,"(£18,000 − £14,000) ÷ (3,000 − 2,000) = £4 per delivery."],["SmartTech Ltd produces 4,000 electronic devices each month. Its costs are: Variable production cost: £15 per unit Monthly fixed production costs: £25,000 What is the total production cost for the month?",["£60,000","£75,000","£100,000","£85,000"],3,"Variable: 4,000 × £15 = £60,000. Add fixed £25,000 = £85,000."],["SmartTech Ltd produces 4,000 electronic devices each month. Its costs are: Variable production cost: £15 per unit Monthly fixed production costs: £25,000 What is the total production cost for the month?",["£60,000","£75,000","£100,000","£85,000"],3,"Same as Q3 (duplicated in the PDF): 4,000 × £15 + £25,000 = £85,000."],["A bakery uses ingredients costing £3 per cake. It normally produces 2,000 cakes per month but expects production to increase to 2,500 cakes next month. Assuming the cost per cake remains unchanged, what will be the total ingredient cost next month?",["£6,000","£6,500","£7,500","£8,500"],2,"Ingredients are a variable cost: 2,500 × £3 = £7,500."],["BikePro Ltd manufactures bicycles. The following costs are incurred in producing one bicycle: Direct materials: £120 Direct labour: £80 Direct expenses: £20 Factory overhead: £50 What is the prime cost per bicycle?",["£200","£220","£250","£270"],1,"Prime cost = direct materials + direct labour + direct expenses = 120 + 80 + 20 = £220."],["ABC Ltd's monthly electricity bill consists of a fixed standing charge plus a charge based on electricity usage. How should the electricity cost be classified?",["Semi-variable cost","Fixed cost","Variable cost","Stepped fixed cost"],0,"A fixed element plus a variable element is a semi-variable (mixed) cost."],["EcoFurniture Ltd manufactures office desks. The following costs were incurred in producing 500 desks during June: Timber: £18,000 Assembly workers' wages: £12,000 Factory supervisor salary: £4,000 Factory rent: £6,000 What is the total prime cost of producing the 500 desks?",["£35,000","£30,000","£40,000","£45,000"],1,"Prime cost = direct materials + direct labour = 18,000 + 12,000 = £30,000. Supervisor and rent are overheads."],["GreenTech Ltd is developing a new cost and management accounting information system. The operations director argues that the system should only record costs needed to calculate inventory values for the annual financial statements. Which one of the following best explains why this approach is inadequate?",["The system should also provide relevant information for decision-making, planning, control and performance measurement.","A cost accounting system should only provide information about variable costs.","Management accounting systems should only record non-financial information.","Inventory valuation is not a purpose of a cost and management accounting system."],0,"Inventory valuation is one purpose, but the system also supports decisions, planning, control and performance measurement."],["CloudConnect Ltd provides IT support services. Its monthly internet and telephone package includes a fixed charge of £1,200 per month, plus an additional £0.08 per minute for customer support calls. As the number of customer support calls increases, the company's total communication cost also increases. How should this cost be classified?",["Fixed cost","Variable cost","Stepped fixed cost","Semi-variable cost"],3,"A fixed charge plus a usage-based charge is semi-variable."],["CyclePro Ltd manufactures premium bicycles. During May, it incurs the following costs: 1. Aluminium used to manufacture bicycle frames 2. Wages of workers assembling bicycles 3. Salary of the factory cleaner 4. Cleaning products used for cleaning the factory floor Which one of the following classifications is correct?",["Items 1, 2 and 3 are direct costs; item 4 is indirect.","Items 1 and 4 are direct costs; items 2 and 3 are indirect.","Items 1 and 2 are direct costs; items 3 and 4 are indirect costs.","All four items are production overheads."],2,"Aluminium (direct material) and assembly wages (direct labour) trace to the product. Cleaner salary and cleaning products are indirect."],["Noa Ltd has experienced rising production costs. Management sets monthly departmental cost targets and compares actual costs against them. Department managers receive reports showing any significant differences so that corrective action can be taken. Which management accounting purpose is most directly illustrated?",["Planning","Controlling","Communicating","Motivating"],1,"Comparing actual with target and taking corrective action is controlling."],["FreshBite Ltd operates six cafés across Essex. The finance director is preparing two reports. Report A summarises the company's annual financial performance for shareholders. Report B analyses the profitability of each café and forecasts costs for the next six months to help managers decide whether to close an underperforming location.Which one of the following correctly describes the reports?",["Report A is financial accounting and Report B is management accounting.","Both reports are financial accounting reports because they contain financial information.","Report A is management accounting and Report B is financial accounting.","Both reports are management accounting reports because managers prepare them"],0,"Financial accounting reports to external users such as shareholders. Management accounting supports internal decisions."],["If an employee is paid £8/h and 0.5% of sales, then this is an example of:",["semi-variable cost","stepped cost","fixed cost","Variable cost"],0,"A basic pay element (hourly) plus a commission varying with sales makes it a mixed, semi-variable cost."],["If a production manager is paid a salary of £500 per week and an extra £0.35 for every unit of production made in the week, this wage could be described as:",["A variable cost","A fixed cost","A semi-variable cost","A stepped fixed cost"],2,"A fixed salary plus a per-unit element is semi-variable."],["A furniture company operates a job costing system. Job number 1200 requires £300 of direct materials and £400 for direct labour. Direct labour is paid at a rate of £8 per hour. Production overheads are absorbed at a rate of £26 per direct labour hour and non-productions overhead are absorbed at a rate of 120% of prime cost. What is the total cost of Job number 1200?",["£2,500","£3,200","£2,840","£5,400"],2,"Prime cost = 300 + 400 = £700. Hours = 400 ÷ 8 = 50. Production overhead = 50 × £26 = £1,300. Non-production overhead = 120% × 700 = £840. Total = 700 + 1,300 + 840 = £2,840."],["The following information relates to the overhead costs of the production department [Table: Units of output | 5,000 | 7,000 — Overheads | £21,100 | £26,100] Calculate the fixed overhead costs:",["£5,000","£8,600","£13,600","£21,100"],1,"Variable rate = (26,100 − 21,100) ÷ (7,000 − 5,000) = £2.50. Fixed = 21,100 − (5,000 × 2.50) = 21,100 − 12,500 = £8,600."],["Direct costs are:",["Costs that change in direct proportion to the number of units produced","Costs that can be expensed to the Income Statement","Costs that can be attributed to an accounting period","Costs that can always be directly identified with a single cost unit"],3,"Direct costs can be traced to a specific cost unit. 'Direct' is not the same as 'variable'.","Option A describes variable costs, but D is the standard definition of a direct cost."],["Which one of the following is included in the prime cost of a product?",["Direct materials costs, direct labour costs and direct expenses costs","Direct materials costs, direct labour costs and production overhead","Direct material costs and nonproduction overhead","Direct labour costs and fixed costs"],0,"Prime cost = direct materials + direct labour + direct expenses."],["A company operates a job costing system. Job 119 requires 110 hours of labour at £8 per hour. Materials and other expenses amount to £1,700. There are 3 employee whose basic hours are 30 hours a week. All work is to be completed in one week at the specific request of the customer. Over time is paid a time and a quarter,What is the total direct labour cost of Job 119?",["£920","£880","£2,580","£2,620"],0,"Basic hours = 3 × 30 = 90; overtime = 20 hours. Basic cost = 110 × £8 = £880. Overtime premium = 20 × £8 × 0.25 = £40. Because the customer requested the speed, the premium is a direct cost: 880 + 40 = £920. (£2,620 would be the total job cost including £1,700 materials.)","Depends on the overtime premium being direct, since it was at the customer's specific request."],["A company incurs the following costs at various activity levels: [Table: Activity Level (Units) | 5,000 | 10,000 — Total Cost (£) | 450,000 | 600,000] What is the variable cost per unit?",["£25","£30","£35","£40"],1,"(600,000 − 450,000) ÷ (10,000 − 5,000) = £30."],["A furniture manufacturer has to pay £800 per week to hire some specialist equipment to complete an order for a hotel chain, How would the equipment hire costs be classified in the furniture manufacturer’s account?",["Production overhead","Selling expenses","Direct expenses","Administrative overhead"],2,"Hire for one specific order is traceable to that job, so it is a direct expense."],["Which of the following would be classified as direct labour?",["Maintenance manager in a company producing cameras","Personnel manager in a company servicing cars","General manager in a DIY shop","Bricklayer in a construction company"],3,"A bricklayer works directly on the product (the construction)."],["A company’s monthly maintenance cost contains both a fixed and a variable element. When units were at their lowest (100 units) the maintenance cost was £15,500, and when machine hours were at their highest (300 units) the maintenance cost was £22,500. What is the company’s estimated monthly maintenance cost, using the high-low method for semi-variable costs when units are 200.",["£7,000","£12,000","£19,000","£21,000"],2,"Variable rate = 7,000 ÷ 200 = £35. Fixed = 15,500 − (100 × 35) = £12,000. At 200 units: 12,000 + 7,000 = £19,000."],["Calculate the production cost if direct material cost is £500, direct labor cost is £300, production overhead is £200 and non-production overhead £150",["£500","£700","£1,000","£1,500"],2,"Production cost = 500 + 300 + 200 = £1,000. The non-production overhead is excluded."],["What type of cost is the salary of a factory maintenance worker?",["Direct cost","Indirect cost","Variable cost","Administration overhead"],1,"It can't be traced to a specific product, so it is an indirect cost (production overhead)."],["Calculate the total cost if a company produces 1,000 units of a product with a variable cost per unit of £10 and fixed costs of £5,000.",["£10,000","£15,000","£20,000","£25,000"],1,"1,000 × £10 + £5,000 = £15,000."],["Which of the following costs is an example of a variable cost?",["Rent for factory building","Depreciation on machinery","Cost of raw materials used in production","Salary of the factory supervisor"],2,"Raw materials rise and fall with output."],["A variable cost:",["Remains constant in total but varies per unit produced","Changes both in total and per unit with changes in production levels","Remains constant per unit but varies in total with changes in production","Remains constant both in total and per unit"],2,"Variable cost per unit is constant, but the total changes with activity."],["What are the three basic cost elements involved in the manufacture of a product?",["Direct material, indirect labor, selling expenses","Direct material, direct labor, production overheads","Variable costs, fixed costs, administrative expenses","Indirect material, direct labor, research and development costs"],1,"The three elements are materials, labour and overheads. Option B states them as direct materials, direct labour and production overheads."],["Which accounting branch is primarily concerned with cost behavior and cost control?",["Financial accounting","Tax accounting","Management accounting","Auditing"],2,"Cost behaviour and control are central to management accounting."],["What role does financial accounting play in decision-making?",["It aids in budget preparation.","It provides detailed cost information for internal planning.","It offers insights into competitors' financial performance.","It helps assess the financial health and stability of an organization."],3,"Financial accounting shows an organisation's financial position and performance to external users."],["What is the main purpose of a cost and management accounting system?",["To prepare financial statements for external reporting","To track and analyze costs, revenues, and performance for internal decision-making purposes","To ensure compliance with tax regulations","To provide information for investors and creditors"],1,"Cost and management accounting serves internal decision-making."],["Which type of accounting information is essential for strategic decision-making?",["Historical financial statements","External audit reports","Management accounting reports","Tax returns"],2,"Strategic decisions need forward-looking, detailed internal information from management accounting."],["How does management accounting differ from financial accounting?",["Management accounting provides information for internal decision-making, while financial accounting is primarily for external reporting.","Management accounting is focused on external stakeholders, while financial accounting is for internal use.","Management accounting emphasizes historical financial data, while financial accounting focuses on future projections.","Management accounting is mandatory for all organizations, while financial accounting is optional."],0,"Management accounting is internal and forward-looking. Financial accounting is external and historical."],["What is the primary focus of financial accounting?",["External reporting","Internal decision-making","Cost analysis","Budgeting"],0,"Financial accounting reports to external users such as shareholders and creditors."],["Which one of the following costs would NOT be classified as a production overhead cost in brewery company?",["The cost of barley and hops","The cost of renting the factory building","The depreciation of equipment located in the materials store","The salary of the factory manager"],0,"Barley and hops are direct materials. The others are production overheads."]]},
{"n":5,"t":"Labour costing and performance evaluation","q":[["Which ONE of the following is a key purpose of effective labour cost control?",["To eliminate all fixed production costs","To ensure employees always work overtime","To identify inefficiencies such as idle time, excessive overtime and low productivity","To increase inventory levels"],2,"Labour cost control aims to spot and reduce inefficiencies such as idle time, excess overtime and low productivity."],["Which ONE of the following is most likely to be classified as a direct labour cost in a manufacturing business?",["Salary of financial director","Basic wages of employees assembling the products","Salary of the factory security guard","Wages of factory maintenance staff"],1,"Direct labour is labour that can be traced to the product, such as assembly workers."],["Emma is paid £14 per hour and works 38 normal hours per week.What is Emma's basic weekly wage?",["£392","£456","£532","£560"],2,"£14 × 38 = £532."],["What does the labour turnover ratio primarily measure?",["The percentage of production completed on time","The proportion of employees leaving relative to the average number employed","Labour cost as a percentage of sales revenue","The proportion of employees working overtime"],1,"Labour turnover = employees leaving ÷ average employees × 100."],["What does net pay represent on an employee's payslip?",["Basic salary before any additional payments","Gross pay before deductions","The amount received by the employee after deductions","Gross pay plus employer National Insurance contributions"],2,"Net pay = gross pay minus deductions (tax, NI, pension, etc.)."],["A company budgeted to produce 2,000 units in 1,000 labour hours. Actual production was 2,100 units, and employees worked 1,050 hours. Which ONE of the following correctly states the labour efficiency, capacity and production volume ratios?",["Efficiency 105%; Capacity 100%; Production volume 105%","Efficiency 95%; Capacity 105%; Production volume 100%","Efficiency 105%; Capacity 105%; Production volume 100%","Efficiency 100%; Capacity 105%; Production volume 105%"],3,"Standard hours for actual output = 2,100 × 0.5 = 1,050. Efficiency = 1,050 ÷ 1,050 = 100%. Capacity = 1,050 ÷ 1,000 = 105%. Production volume = 1,050 ÷ 1,000 = 105%."],["What does the labour capacity ratio measure?",["How efficiently employees use the hours actually worked","The percentage of employees leaving the organisation","The proportion of output that is defective","The proportion of available budgeted hours that are actually worked"],3,"Capacity = actual hours worked ÷ budgeted hours."],["What is a key feature of a piecework remuneration system?",["Employees receive the same wage regardless of output","Employees are paid only for overtime hours","Employees are paid a fixed amount for each unit produced","Employees are paid according to the number of hours spent at work"],2,"Piecework pays a fixed rate per unit produced."],["An employee has the following information on their monthly payslip: Basic salary: £2,800 Bonus: £300 Income tax: £420 National Insurance: £190 Pension contribution: £155 What is the employee's net pay?",["£2,235","£2,490","£2,335","£3,100"],2,"Gross = 2,800 + 300 = £3,100. Deductions = 420 + 190 + 155 = £765. Net = £2,335."],["A factory introduces a piecework scheme and subsequently experiences a significant increase in output but also a substantial increase in defective units. Which ONE of the following is the most likely explanation?",["Employees have less incentive to increase production","Employees may be prioritising quantity over quality","Fixed production costs have automatically increased","Employees are being rewarded according to hours worked rather than output"],1,"Piecework rewards units produced, which can encourage speed over quality."],["A company produces 1,200 units of a product. The standard time allowed is 0.5 labour hours per unit. Actual labour hours worked are 625 hours. What is the labour efficiency ratio?",["94%","104%","125%","96%"],3,"Standard hours = 1,200 × 0.5 = 600. Efficiency = 600 ÷ 625 = 96%."],["A factory has 5,000 budgeted labour hours available during a month. Employees actually work 4,500 hours. What is the labour capacity ratio?",["80%","90%","100%","111.1%"],1,"4,500 ÷ 5,000 = 90%."],["A company budgeted to produce 5,000 units using 2,500 labour hours. During the period, it actually produced 4,800 units using 2,400 labour hours. Which ONE of the following statements is correct?",["Efficiency = 100%; Capacity = 96%; Production volume = 96%","Efficiency = 96%; Capacity = 100%; Production volume = 96%","Efficiency = 100%; Capacity = 100%; Production volume = 96%","Efficiency = 96%; Capacity = 96%; Production volume = 100%"],0,"Standard hours for actual output = 4,800 × 0.5 = 2,400. Efficiency = 2,400 ÷ 2,400 = 100%. Capacity = 2,400 ÷ 2,500 = 96%. Production volume = 2,400 ÷ 2,500 = 96%."],["What does the labour efficiency ratio compare?",["Standard hours for actual output with actual hours worked","Actual hours worked with total budgeted hours","Standard hours for actual output with total sales revenue","Employees leaving with the average number of employees"],0,"Efficiency = standard hours for actual output ÷ actual hours worked."],["Daniel is paid £12 per hour for a 40-hour week. Overtime is paid at time-and-a-half. During one week, Daniel works 45 hours. What is his total gross wage for the week?",["£510","£540","£600","£570"],3,"40 × £12 = £480. Overtime: 5 × £18 = £90. Total = £570."],["A factory employs 50 direct workers paid £12 per hour. During a particular week: Each worker completes 2 overtime hours due to general production requirements. Overtime is paid at time-and-a-half. A machine breakdown causes a further 40 hours of paid idle time across the workforce. What is the total indirect labour cost arising from the overtime premium and idle time?",["£600","£1,080","£1,200","£1,680"],1,"Overtime hours = 50 × 2 = 100. Premium = 100 × £6 = £600 (indirect, since the overtime is for general demand). Idle time = 40 × £12 = £480. Total = £1,080."],["Which ONE of the following is an avoidable cause of labour turnover?",["Poor working conditions","Retirement","Employee death","Family relocation"],0,"Management can control working conditions. The others are unavoidable."],["A direct production employee is paid £15 per hour. During the week, 6 hours are recorded as idle time because of a machine breakdown. What amount should be treated as an indirect labour cost in respect of the idle time?",["£90","£45","£60","£135"],0,"Idle time is an indirect cost: 6 × £15 = £90."],["A production employee earns £16 per hour. Overtime is paid at time-and-a-half. During the week, the employee works 6 overtime hours due to general production requirements. What is the overtime premium?",["£48","£96","£192","£144"],0,"Premium = half the hourly rate: 0.5 × £16 = £8 per hour × 6 hours = £48."],["A direct production employee works overtime because the factory as a whole is unusually busy. How should the overtime premium normally be classified?",["Indirect labour cost","Direct material cost","Direct labour cost","Selling overhead"],0,"When overtime is due to general pressure, the premium is spread across all production as indirect labour (overhead)."],["A company has 4,000 budgeted labour hours for a period. The standard time required for the actual output achieved is 4,200 hours. What is the labour production volume (activity) ratio?",["95%","100%","105%","120%"],2,"4,200 ÷ 4,000 = 105%."],["A factory worker is paid £3.20 for each unit produced. During the week, the employee produces 175 units. What is the employee's piecework wage?",["£525","£560","£540","£575"],1,"175 × £3.20 = £560."],["A factory employs 80 direct production workers, each paid £10 per hour. Each employee works 4 overtime hours during the week due to general production requirements. Overtime is paid at time-and-a-half. What is the total indirect labour cost arising from the overtime premium?",["£3,200","£4,800","£6,400","£1,600"],3,"Overtime hours = 80 × 4 = 320. Premium = £5 per hour × 320 = £1,600."],["A company's standard time is 2 hours per unit. During the month, 500 units are produced using 900 actual labour hours. What is the labour efficiency ratio?",["111.1%","90.0%","100.0%","120.0%"],0,"Standard hours = 500 × 2 = 1,000. Efficiency = 1,000 ÷ 900 = 111.1%."],["Which ONE of the following is an important characteristic of an effective employee incentive scheme?",["It should be difficult for employees to understand","It should reward employees regardless of their performance","It should be closely related to employee effort and be simple to operate","It should be introduced without consulting employees"],2,"Effective schemes link reward to effort and are simple to understand and run."],["Which ONE of the following best describes a time-based remuneration system?",["Employees are paid according to the number of units produced","Employees receive only a percentage of the company's profit","Employees are paid according to the selling price of the products produced","Employees are paid according to the time they work"],3,"Time-based pay rewards hours worked, regardless of output."],["Which ONE of the following would normally be classified as an indirect labour cost?",["Salary of a factory maintenance engineer","Basic wages of an employee assembling products","Basic wages of an employee operating a production machine","Basic wages of an employee packaging a product, where the cost can be directly traced to production"],0,"Maintenance staff support production but are not traceable to specific products."],["Which ONE of the following best describes idle time?",["Time spent producing defective products","Unpaid breaks taken by employees","Overtime worked beyond contracted hours","Time for which employees are paid but are not producing output"],3,"Idle time is paid time with no output, e.g. during a breakdown."],["Which ONE of the following is a replacement cost associated with labour turnover?",["Improving working conditions","Providing competitive salaries to existing employees","Improving promotion opportunities","Advertising a vacant position"],3,"Replacement costs arise when replacing leavers (advertising, recruitment, training). The others are preventive costs."],["A company employed 800 employees at the beginning of the year and 1,000 employees at the end of the year. During the year, 90 employees left and required replacement. Using the average number of employees, what is the labour turnover rate?",["9%","11.25%","10%","20%"],2,"Average = (800 + 1,000) ÷ 2 = 900. Turnover = 90 ÷ 900 = 10%."]]}

const A=document.getElementById('app');let W,i,sc,ans,done;
function home(){A.innerHTML='<h1>Accounting Quiz</h1><p class="mu">Questions and options follow the same order as the PDFs.</p>'+WEEKS.map((w,k)=>`<button class="wk card" onclick="start(${k})"><b>Week ${w.n}: ${w.t}</b><br><small>${w.q.length} questions</small></button>`).join('')}
function start(k){W=WEEKS[k];i=0;sc=0;ans=[];done=false;show()}
function show(){const q=W.q[i],a=ans[i];let h=`<p class="mu"><a href="#" onclick="home();return false">← Weeks</a> · Week ${W.n}: ${W.t}</p><div class="bar"><i style="width:${i/W.q.length*100}%"></i></div><div class="card"><p class="mu">Question ${i+1} of ${W.q.length}</p><p><b>${q[0]}</b></p>`;
q[1].forEach((o,k)=>{let c='opt';if(a!==undefined){if(k===q[2])c+=' ok';else if(k===a)c+=' no'}h+=`<button class="${c}" ${a!==undefined?'disabled':''} onclick="pick(${k})">${String.fromCharCode(65+k)}. ${o}</button>`});
if(a!==undefined){h+=`<div class="fb"><b>${a===q[2]?'✅ Correct':'❌ Incorrect'}</b> – Answer: ${String.fromCharCode(65+q[2])}. ${q[1][q[2]]}<br>${q[3]}</div>`+(q[4]?`<div class="flag">⚠️ Lecturer note: ${q[4]}</div>`:'')}
h+=`</div><div class="row"><button ${i==0?'disabled':''} onclick="i--;show()">Back</button><button class="pri" ${a===undefined?'disabled':''} onclick="next()">${i==W.q.length-1?'Finish':'Next'}</button></div>`;A.innerHTML=h}
function pick(k){if(ans[i]!==undefined)return;ans[i]=k;if(k===W.q[i][2])sc++;show()}
function next(){if(i<W.q.length-1){i++;show()}else end()}
function end(){const n=W.q.length;const wrong=W.q.map((q,k)=>ans[k]!==q[2]?k:-1).filter(k=>k>=0);
A.innerHTML=`<h1>Week ${W.n} complete</h1><div class="card"><h2>${sc} / ${n} (${Math.round(sc/n*100)}%)</h2>`+(wrong.length?`<p>Review these questions: ${wrong.map(k=>`<a href="#" onclick="i=${k};show();return false">Q${k+1}</a>`).join(', ')}</p>`:'<p>Perfect score!</p>')+`</div><div class="row"><button class="pri" onclick="start(WEEKS.indexOf(W))">Retry</button><button onclick="home()">All weeks</button></div>`}
home();
</script></body></html>
